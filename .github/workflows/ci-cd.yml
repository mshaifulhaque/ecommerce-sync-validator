name: Ecommerce Integration Tests

on:
  push:
    branches: [ "main" ]
  schedule:
    # This automatically runs your tests every day at 2:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your project code from GitHub
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Set up Java 17 on the cloud computer
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Run Maven test command automatically
    - name: Run Integration Tests
      run: mvn test